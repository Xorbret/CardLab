name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Native tests
        run: pio test -e native

  firmware:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write  # publish the dev-build release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio esptool
      - name: Build firmware
        run: pio run -e cardputer-adv
      - name: Merge into one flashable image
        run: |
          B=.pio/build/cardputer-adv
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          python -m esptool --chip esp32s3 merge_bin -o cardlab.bin \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          cp $B/firmware.bin cardlab-app.bin
      - name: Package SD card content
        run: |
          mkdir -p sd && cp -r content sd/cardlab
          (cd sd && zip -qr ../cardlab-sd.zip cardlab)
      - uses: actions/upload-artifact@v4
        with:
          name: cardlab-firmware
          path: |
            cardlab.bin
            cardlab-app.bin
            content/
      # Release assets download directly in a phone browser, unlike Actions
      # artifacts. Skipped for pull requests from forks (no write token).
      - name: Publish dev build
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: Latest dev build
          prerelease: true
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          files: |
            cardlab.bin
            cardlab-app.bin
            cardlab-sd.zip
          body: |
            Built from ${{ github.event.pull_request.head.sha || github.sha }}. Untested on hardware.

            - `cardlab-app.bin`: app image for M5Launcher.
            - `cardlab.bin`: full image, flash at 0x0 with M5Burner or esptool.
            - `cardlab-sd.zip`: unzip to the root of the SD card so you get `/cardlab/lessons` and `/cardlab/scenarios`.
