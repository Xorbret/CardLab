; CardLab firmware. Build: pio run -e cardputer-adv   Tests: pio test -e native

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    m5stack/M5Cardputer@^1.1.1
test_ignore = *

[env:native]
platform = native
; Only the platform-independent core is built for host tests.
lib_ignore = M5Cardputer
build_src_filter = -<*>
lib_compat_mode = off
build_flags = -std=gnu++17 -Wall
test_build_src = no
